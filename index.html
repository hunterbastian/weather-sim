<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        h1 {
            color: #fff;
            font-size: 2rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* Weather Box */
        .weather-box {
            width: 350px;
            height: 300px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            transition: background 0.5s ease;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 30px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #FFD700 0%, #FFA500 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px #FFD700, 0 0 100px #FFA500;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sun.active {
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px #FFD700, 0 0 100px #FFA500; }
            50% { transform: scale(1.1); box-shadow: 0 0 80px #FFD700, 0 0 120px #FFA500; }
        }

        /* Clouds */
        .clouds {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        .cloud-1 {
            width: 80px;
            height: 30px;
            top: 40px;
            left: 20px;
        }
        .cloud-1::before { width: 40px; height: 40px; top: -20px; left: 10px; }
        .cloud-1::after { width: 50px; height: 50px; top: -25px; left: 35px; }

        .cloud-2 {
            width: 100px;
            height: 35px;
            top: 70px;
            left: 120px;
        }
        .cloud-2::before { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud-2::after { width: 60px; height: 60px; top: -30px; left: 45px; }

        .cloud-3 {
            width: 70px;
            height: 25px;
            top: 30px;
            right: 30px;
        }
        .cloud-3::before { width: 35px; height: 35px; top: -18px; left: 8px; }
        .cloud-3::after { width: 45px; height: 45px; top: -22px; left: 30px; }

        /* Rain */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(transparent, rgba(174, 194, 224, 0.8));
            animation: fall linear infinite;
            opacity: 0;
        }

        @keyframes fall {
            0% { transform: translateY(-20px); }
            100% { transform: translateY(320px); }
        }

        /* Storm/Lightning */
        .lightning {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0);
            pointer-events: none;
            transition: background 0.1s;
        }

        .lightning.flash {
            background: rgba(255, 255, 255, 0.9);
        }

        .lightning-bolt {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 80px;
            opacity: 0;
            filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 20px #87CEEB);
        }

        .lightning-bolt svg {
            width: 100%;
            height: 100%;
        }

        /* Ground */
        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, #228B22 0%, #006400 100%);
            border-radius: 0 0 20px 20px;
        }

        .grass {
            position: absolute;
            bottom: 50px;
            width: 100%;
            display: flex;
            justify-content: space-around;
        }

        .grass-blade {
            width: 3px;
            height: 15px;
            background: #32CD32;
            border-radius: 50% 50% 0 0;
            transform-origin: bottom center;
        }

        /* Controls */
        .controls {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 350px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-label {
            color: #fff;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-value {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            min-width: 40px;
            text-align: right;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Sun slider */
        .slider.sun-slider {
            background: linear-gradient(90deg, #2c3e50 0%, #FFD700 100%);
        }
        .slider.sun-slider::-webkit-slider-thumb {
            background: linear-gradient(135deg, #FFD700, #FFA500);
        }

        /* Rain slider */
        .slider.rain-slider {
            background: linear-gradient(90deg, #2c3e50 0%, #4A90D9 100%);
        }
        .slider.rain-slider::-webkit-slider-thumb {
            background: linear-gradient(135deg, #4A90D9, #2E5984);
        }

        /* Storm slider */
        .slider.storm-slider {
            background: linear-gradient(90deg, #2c3e50 0%, #8B5CF6 100%);
        }
        .slider.storm-slider::-webkit-slider-thumb {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
        }

        .icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather Simulation</h1>

        <div class="weather-box" id="weatherBox">
            <!-- Sun -->
            <div class="sun" id="sun"></div>

            <!-- Clouds -->
            <div class="clouds" id="clouds">
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
            </div>

            <!-- Rain -->
            <div class="rain-container" id="rainContainer"></div>

            <!-- Lightning -->
            <div class="lightning" id="lightning"></div>
            <div class="lightning-bolt" id="lightningBolt">
                <svg viewBox="0 0 24 24" fill="#FFD700">
                    <path d="M13 0L0 13h9v11l13-13h-9z"/>
                </svg>
            </div>

            <!-- Ground -->
            <div class="ground">
                <div class="grass" id="grass"></div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="control-header">
                    <span class="control-label"><span class="icon">☀️</span> Sun</span>
                    <span class="control-value" id="sunValue">0%</span>
                </div>
                <input type="range" min="0" max="100" value="0" class="slider sun-slider" id="sunSlider">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span class="control-label"><span class="icon">🌧️</span> Rain</span>
                    <span class="control-value" id="rainValue">0%</span>
                </div>
                <input type="range" min="0" max="100" value="0" class="slider rain-slider" id="rainSlider">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span class="control-label"><span class="icon">⛈️</span> Storm</span>
                    <span class="control-value" id="stormValue">0%</span>
                </div>
                <input type="range" min="0" max="100" value="0" class="slider storm-slider" id="stormSlider">
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const weatherBox = document.getElementById('weatherBox');
        const sun = document.getElementById('sun');
        const clouds = document.getElementById('clouds');
        const rainContainer = document.getElementById('rainContainer');
        const lightning = document.getElementById('lightning');
        const lightningBolt = document.getElementById('lightningBolt');
        const grass = document.getElementById('grass');

        const sunSlider = document.getElementById('sunSlider');
        const rainSlider = document.getElementById('rainSlider');
        const stormSlider = document.getElementById('stormSlider');

        const sunValue = document.getElementById('sunValue');
        const rainValue = document.getElementById('rainValue');
        const stormValue = document.getElementById('stormValue');

        // State
        let raindrops = [];
        let stormInterval = null;
        let currentStormIntensity = 0;

        // Initialize grass
        function initGrass() {
            for (let i = 0; i < 50; i++) {
                const blade = document.createElement('div');
                blade.className = 'grass-blade';
                blade.style.height = `${10 + Math.random() * 15}px`;
                grass.appendChild(blade);
            }
        }

        // Create raindrops
        function createRaindrop() {
            const drop = document.createElement('div');
            drop.className = 'raindrop';
            drop.style.left = `${Math.random() * 100}%`;
            drop.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;
            drop.style.animationDelay = `${Math.random() * 0.5}s`;
            rainContainer.appendChild(drop);
            return drop;
        }

        // Update rain
        function updateRain(intensity) {
            const targetCount = Math.floor(intensity * 1.5); // Max 150 drops at 100%

            // Add or remove raindrops
            while (raindrops.length < targetCount) {
                raindrops.push(createRaindrop());
            }
            while (raindrops.length > targetCount) {
                const drop = raindrops.pop();
                drop.remove();
            }

            // Update opacity based on intensity
            const opacity = intensity / 100;
            raindrops.forEach(drop => {
                drop.style.opacity = opacity;
            });

            // Update clouds opacity for rain
            const cloudElements = clouds.querySelectorAll('.cloud');
            cloudElements.forEach(cloud => {
                if (intensity > 0 || currentStormIntensity > 0) {
                    cloud.style.opacity = Math.max(intensity / 100, currentStormIntensity / 100) * 0.9;
                    cloud.style.background = intensity > 50 || currentStormIntensity > 50 ? '#8B8B8B' : '#C0C0C0';
                } else {
                    cloud.style.opacity = 0;
                }
            });
        }

        // Update sun
        function updateSun(intensity) {
            sun.style.opacity = intensity / 100;
            if (intensity > 0) {
                sun.classList.add('active');
            } else {
                sun.classList.remove('active');
            }

            // Update sky color based on sun intensity and weather
            updateSkyColor();
        }

        // Update sky color
        function updateSkyColor() {
            const sunIntensity = parseInt(sunSlider.value);
            const rainIntensity = parseInt(rainSlider.value);
            const stormIntensity = parseInt(stormSlider.value);

            let skyTop, skyBottom;

            if (stormIntensity > 50) {
                // Dark stormy sky
                skyTop = '#2C3E50';
                skyBottom = '#4A5568';
            } else if (rainIntensity > 50) {
                // Overcast sky
                skyTop = '#5D6D7E';
                skyBottom = '#85929E';
            } else if (sunIntensity > 70) {
                // Bright sunny sky
                skyTop = '#4A90D9';
                skyBottom = '#87CEEB';
            } else {
                // Default sky
                skyTop = '#87CEEB';
                skyBottom = '#E0F6FF';
            }

            weatherBox.style.background = `linear-gradient(180deg, ${skyTop} 0%, ${skyBottom} 100%)`;
        }

        // Lightning flash
        function triggerLightning() {
            lightning.classList.add('flash');
            lightningBolt.style.opacity = 1;
            lightningBolt.style.left = `${20 + Math.random() * 60}%`;

            setTimeout(() => {
                lightning.classList.remove('flash');
                lightningBolt.style.opacity = 0;
            }, 100);

            // Double flash sometimes
            if (Math.random() > 0.5) {
                setTimeout(() => {
                    lightning.classList.add('flash');
                    lightningBolt.style.opacity = 1;
                    setTimeout(() => {
                        lightning.classList.remove('flash');
                        lightningBolt.style.opacity = 0;
                    }, 50);
                }, 150);
            }
        }

        // Update storm
        function updateStorm(intensity) {
            currentStormIntensity = intensity;

            // Clear existing interval
            if (stormInterval) {
                clearInterval(stormInterval);
                stormInterval = null;
            }

            if (intensity > 0) {
                // Lightning frequency based on intensity
                const minInterval = 500;
                const maxInterval = 5000;
                const interval = maxInterval - (intensity / 100) * (maxInterval - minInterval);

                stormInterval = setInterval(() => {
                    if (Math.random() < intensity / 100) {
                        triggerLightning();
                    }
                }, interval);

                // Add rain with storm
                const currentRain = parseInt(rainSlider.value);
                if (currentRain < intensity * 0.5) {
                    updateRain(Math.max(currentRain, intensity * 0.5));
                }
            }

            // Update clouds for storm
            const cloudElements = clouds.querySelectorAll('.cloud');
            cloudElements.forEach(cloud => {
                if (intensity > 0) {
                    cloud.style.opacity = Math.max(intensity / 100, parseInt(rainSlider.value) / 100) * 0.9;
                    cloud.style.background = intensity > 30 ? '#5D6D7E' : '#8B8B8B';
                }
            });

            updateSkyColor();
        }

        // Event listeners
        sunSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            sunValue.textContent = `${value}%`;
            updateSun(parseInt(value));
        });

        rainSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            rainValue.textContent = `${value}%`;
            updateRain(parseInt(value));
            updateSkyColor();
        });

        stormSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            stormValue.textContent = `${value}%`;
            updateStorm(parseInt(value));
        });

        // Initialize
        initGrass();

        // Set some initial sun
        sunSlider.value = 50;
        sunValue.textContent = '50%';
        updateSun(50);
    </script>
</body>
</html>
